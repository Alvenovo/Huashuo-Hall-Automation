meta:
  说明: 用例清单唯一真源。脚本只读它，从不写回。改动请只改这个文件。
  最后更新: '2026-10-12'
  字段说明: id 编号 / title 用例名 / suite 套件(见 hall_auto/suites.py) / marker pytest 标记 / tier code=逻辑在代码里 data=参数化数据驱动 / kind case=业务用例 probe=探针 / status active|manual|xfail|destructive / verify 具体验证什么 / ref 代码指针 / needs 运行前提
  编号规则: P0 沿用原清单编号；其余按组自编 P1A/P1B/P1C/P1D/P2S(安全)/P2W(WorkBuddy)
