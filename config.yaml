    password: ""

# 夹具/应用「怎么认」的参数 —— **换 app 时优先改这里，不用动 Python**。
# 名字按子串模糊匹配（跟 fixture_proc_hints 一个口径）；没匹配到就用代码里的默认值。
#
# 为什么需要它：apps.py 里有几处「针对某个 app」的假设（进程名、自绘按钮面积门槛），
# 原来写死在代码里。换夹具应用时那些假设会静默失效 —— 典型后果是装之前没收进程，
# 撞 NSIS「不能打开要写入的文件」模态框干等到超时（2026-09-29 真踩）。
# 现在把它们摊到配置里：**换 app = 在这里加一条**。
fixture_profiles:
  "网易云音乐":
    # 装之前要先收掉的进程映像名（不带 .exe）。
    # 不收的后果：应用运行时锁着安装目录里的文件（网易云的 icudtl.dat），
    # 安装器覆盖不进去，弹模态框等人工 → 无人值守干等到超时。
    process_names: ["cloudmusic"]
    # 自绘主按钮的最小面积。网易云「立即安装」是 360x60=21600；
    # 右上角关闭叉 36x36=1296、协议链接最大 144x25=3600，都远在门槛之下。
    # 换成别的 app 时：实测它的主按钮面积，比这个门槛小就往下调。
    cta_min_area: 12000

fixture_apps:
  install: ""
  update: ""
  uninstall: ""
  sync: ""

# P1-A 更新夹具：钉一个官方老版本，大厅目录里就永远有更新可点。
# package 是相对 installer_dir 的路径；sha256 防本地包被换；版本号一律运行时读，不写死。
# **这块进 committed 配置是因为它和机器无关**：bootstrap 只逐台写 installer_dir 等机器绑定字段，
# 留空则每台新机（含节点）的更新用例永久 skip。包由 bootstrap 第 4 步从共享盘/官方源铺到
# installer_dir/fixtures/（与 bootstrap 的 FIXTURE_REL 同一路径、同一摘要）。
update_fixture:
  name: 7-Zip（64位）   # 大厅更新列表里的目录名，不是注册表 DisplayName（探壳结论记过的坑）
  registry_hint: 7-Zip
  pinned_version: '26.02'
  package: fixtures/7z2602-x64.exe
  sha256: 6745fa76dc2ea031596d8678f6f6b99c3c1b435b4164a63485adbbc7b8d82ef0
  url: https://www.7-zip.org/a/7z2602-x64.exe
  install_dir: C:/Program Files/7-Zip
  version_exe: 7zFM.exe

# P2 安全验证（组长用例表「安全验证」板块的固定项：安装包数字签名 / 个人空间盘签名 /
# 控制面板信息 / 签章检查报告）。CheckAppV.exe、SignCheck_v2.ps1 是公司内部工具，
# 不进仓库：tools_dir 每台机器在 config.local.yaml 指到本地目录，空则用例 skip。
security:
  tools_dir: ""
  seven_zip: "C:/Program Files/7-Zip/7z.exe"
  personal_storage_dir: "C:/Program Files (x86)/ASUS/PersonalStorage"
  package: ""
  work_dir: ""
  # 行 14「安全清单 vs 安装包清单对比」：manifest 是开发给的安全清单（一行一个相对包根
  # 路径，容忍 csv 首列与 # 注释），相对 installer_dir 或绝对路径；空则用例 skip。
  # manifest_scope 决定对比范围：signable 只比可签名文件，all 比包内全部文件。
  manifest: ""
  manifest_scope: "signable"
