# ⚠️ 下面这个值是**故意的金丝雀**（原开发机的路径），不是漏改的残留，**别"清理"它**：
# bootstrap 第 1 步靠 `_foreign_profile_owner` 认出「这台机器还没铺过环境 / 整包拷贝带了老机器的
# config.local.yaml」—— 认出来才会提示你加 `-InstallerDir` 重跑。换成 `C:/Users/Public/...`
# （脚本自己的默认值）这条检查就失效了，新机取包失败**而报错长得像"共享盘坏了"**。
# 真值写在被 .gitignore 的 `config.local.yaml` 里。约束见 AGENTS.md「机器绝对路径不进代码」。
installer_dir: "C:/Users/ASUS/Desktop/华硕大厅"
baseline_setup: "myappstore_1.6.8.17S_Setup.exe"
latest_setup: "myappstore_1.6.10.7S_Setup.exe"

# 安装包获取（组长 2026-09-18 要求：脚本在测试机自动下载对应大厅）。
# 查找顺序：installer_dir 直属 -> installer_dir/_cache -> 共享盘 -> 下载。
# url_template 支持 {filename} 占位；不填走默认 CDN（dlcdnets.asus.com）。
# sha256 是「文件名 -> 期望摘要」映射，填了才校验，不填只记录实际值。
download:
  url_template: ""
  # 举例（拿到官方直链后填这里，防下到半截包）：
  # sha256:
  #   myappstore_1.6.8.17S_Setup.exe: "<64位十六进制>"
  sha256: {}

# 共享盘分发（没有官方下载地址时的主路）。2026-09-18 实测：本机建 hall-packages 共享，
# 另一台机器用 `net use \\LAPTOP-VS5F7HF4\hall-packages /user:hallshare "<密码>"` 可访问。
# 共享盘不可达会被静默跳过（自动降级到下载），绝不因为共享盘挂了让整轮跑批失败。
# 环境变量 HALL_PACKAGE_SHARE 可临时覆盖（单机切换用，不必改配置）。
#
# ⚠️ **写机器名，不要写 IP**：本机 IP 由 DHCP 分配，会变。
# 2026-09-18 实测就踩过：配的是 `//<共享盘IP>/...`，机器重启后 IP 变成 <共享盘IP>，
# 于是所有节点报「找不到网络名（系统错误 67）」—— 看起来像共享没建，实际是 IP 过期。
# 机器名（NetBIOS/LLMNR 解析）在同一局域网里是稳的。
package_share:
  dirs:
    - "//LAPTOP-VS5F7HF4/hall-packages"
  # 例（多共享盘做冗余，按顺序试，不可达的会被跳过）：
  # dirs:
  #   - "//LAPTOP-VS5F7HF4/hall-packages"       # 机器名访问（推荐）
  #   - "//<共享盘IP>/hall-packages"           # 备用：本机当时 IP，会随 DHCP 变化

